naftiko: 1.0.0-alpha2
info:
  label: Sync Microsoft Outlook contacts into HubSpot
  description: For each Outlook contact in the signed-in user's mailbox, create or update the matching HubSpot Contact with company, title, and phone.
  tags:
  - Microsoft
  - Integration
  - CRM
  - hubspot
  created: '2026-05-20'
  modified: '2026-05-20'
binds:
- namespace: env
  keys:
    MICROSOFT_API_KEY: MICROSOFT_API_KEY
    HUBSPOT_API_KEY: HUBSPOT_API_KEY
capability:
  consumes:
  - type: http
    namespace: microsoft
    baseUri: https://graph.microsoft.com
    description: Microsoft API operations consumed by this integration.
    resources:
    - name: v1-0-me-contacts
      path: /v1.0/me/contacts
      operations:
      - name: listmycontacts
        method: GET
        description: List Outlook contacts for the signed-in user.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters: []
    - name: v1-0-me-contacts-contact-id
      path: /v1.0/me/contacts/{contact-id}
      operations:
      - name: getmycontact
        method: GET
        description: Get a single Outlook contact by id.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: contact-id
          in: path
          type: string
          description: Path parameter contact-id.
          required: true
  - type: http
    namespace: hubspot
    baseUri: https://api.hubapi.com
    description: HubSpot CRM API operations consumed by this integration.
    resources:
    - name: crm-v3-objects-contacts
      path: /crm/v3/objects/contacts
      operations:
      - name: createcontact
        method: POST
        description: 'HubSpot CRM API: createContact'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: crm-v3-objects-contacts-contactid
      path: /crm/v3/objects/contacts/{contactId}
      operations:
      - name: updatecontact
        method: PATCH
        description: 'HubSpot CRM API: updateContact'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: contactId
          in: path
          type: string
          description: Path parameter contactId.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: mcp
    namespace: microsoft-hubspot-mcp
    description: MCP adapter for the microsoft-hubspot integration.
    tools:
    - name: microsoft_hubspot
      description: Execute the microsoft hubspot integration end-to-end.
      inputSchema:
        type: object
        properties:
          trigger_event:
            type: object
            description: Triggering event payload.
        required:
        - trigger_event
  - type: rest
    namespace: microsoft-hubspot-rest
    port: 8080
    description: REST adapter for the microsoft-hubspot integration.
    resources:
    - path: /microsoft-hubspot
      name: microsoft-hubspot
      description: REST surface for the microsoft-hubspot integration.
      operations:
      - method: POST
        name: trigger
        description: Trigger the microsoft-hubspot integration.
        call: microsoft_hubspot
        with:
          trigger_event: rest.body
        outputParameters:
        - type: object
          mapping: $.
