}

input UpdateManagedDeviceInput {
  deviceName: String
  ownerType: ManagedDeviceOwnerType
  deviceCategoryId: ID
}

# ---------------------------------------------------------------------------
# Mutation
# ---------------------------------------------------------------------------

type Mutation {
  # User
  createUser(input: CreateUserInput!): User
  updateUser(id: ID!, input: UpdateUserInput!): User
  deleteUser(id: ID!): Boolean
  assignLicense(userId: ID!, input: AssignLicenseInput!): User

  # Group
  createGroup(input: CreateGroupInput!): Group
  updateGroup(id: ID!, input: JSON): Group
  deleteGroup(id: ID!): Boolean
  addGroupMember(groupId: ID!, userId: ID!): Boolean
  removeGroupMember(groupId: ID!, userId: ID!): Boolean
  addGroupOwner(groupId: ID!, userId: ID!): Boolean

  # Teams
  createTeam(input: CreateTeamInput!): Team
  updateTeam(id: ID!, input: JSON): Team
  archiveTeam(id: ID!): Boolean
  createChannel(teamId: ID!, input: CreateChannelInput!): Channel
  updateChannel(teamId: ID!, channelId: ID!, input: JSON): Channel
  deleteChannel(teamId: ID!, channelId: ID!): Boolean
  sendChannelMessage(teamId: ID!, channelId: ID!, input: MessageInput!): ChannelMessage
  replyToChannelMessage(teamId: ID!, channelId: ID!, messageId: ID!, input: MessageInput!): ChannelMessage
  addTeamMember(teamId: ID!, userId: ID!, roles: [String]): TeamMember

  # Calendar & Events
  createEvent(calendarId: ID!, input: CreateEventInput!): Event
  updateEvent(id: ID!, input: UpdateEventInput!): Event
  deleteEvent(id: ID!): Boolean
  cancelEvent(id: ID!, comment: String): Boolean

  # Mail
  sendMail(input: SendMailInput!): Boolean
  createDraft(input: MessageDraftInput!): Message
  updateMessage(id: ID!, input: JSON): Message
  deleteMessage(id: ID!): Boolean
  moveMessage(id: ID!, destinationId: ID!): Message

  # Contacts
  createContact(input: JSON): Contact
  updateContact(id: ID!, input: JSON): Contact
  deleteContact(id: ID!): Boolean

  # Planner
  createPlannerPlan(input: CreatePlannerPlanInput!): PlannerPlan
  updatePlannerPlan(id: ID!, input: JSON): PlannerPlan
  deletePlannerPlan(id: ID!): Boolean
  createPlannerBucket(planId: ID!, name: String!): PlannerBucket
  updatePlannerBucket(id: ID!, input: JSON): PlannerBucket
  deletePlannerBucket(id: ID!): Boolean
  createPlannerTask(input: CreatePlannerTaskInput!): PlannerTask
  updatePlannerTask(id: ID!, input: JSON): PlannerTask
  deletePlannerTask(id: ID!): Boolean

  # To Do
  createTodoList(displayName: String!): TodoTaskList
  updateTodoList(id: ID!, displayName: String!): TodoTaskList
  deleteTodoList(id: ID!): Boolean
  createTodoTask(listId: ID!, input: CreateTodoTaskInput!): TodoTask
  updateTodoTask(listId: ID!, taskId: ID!, input: JSON): TodoTask
  deleteTodoTask(listId: ID!, taskId: ID!): Boolean

  # Applications & Service Principals
  createApplication(input: CreateApplicationInput!): Application
  updateApplication(id: ID!, input: JSON): Application
  deleteApplication(id: ID!): Boolean
  addApplicationPassword(appId: ID!, displayName: String!): PasswordCredential
  removeApplicationPassword(appId: ID!, keyId: ID!): Boolean
  createServicePrincipal(appId: ID!): ServicePrincipal
  updateServicePrincipal(id: ID!, input: JSON): ServicePrincipal
  deleteServicePrincipal(id: ID!): Boolean
  grantOAuth2Permission(input: JSON): OAuth2PermissionGrant
  revokeOAuth2Permission(id: ID!): Boolean

  # Conditional Access
  createConditionalAccessPolicy(input: CreateConditionalAccessPolicyInput!): ConditionalAccessPolicy
  updateConditionalAccessPolicy(id: ID!, input: JSON): ConditionalAccessPolicy
  deleteConditionalAccessPolicy(id: ID!): Boolean

  # Security
  updateSecurityAlert(id: ID!, status: AlertStatus, assignedTo: String, classification: String, determination: String, comment: String): SecurityAlert
  dismissRiskyUser(id: ID!): Boolean
  confirmRiskyUserCompromised(id: ID!): Boolean
  updateSecureScoreControlProfile(id: ID!, input: JSON): SecureScoreControlProfile

  # Intune
  updateManagedDevice(id: ID!, input: UpdateManagedDeviceInput!): ManagedDevice
  wipeDevice(id: ID!): Boolean
  rebootDevice(id: ID!): Boolean
  syncDevice(id: ID!): Boolean
  retireDevice(id: ID!): Boolean
  createDeviceConfiguration(input: JSON): DeviceConfiguration
  updateDeviceConfiguration(id: ID!, input: JSON): DeviceConfiguration
  deleteDeviceConfiguration(id: ID!): Boolean
  assignDeviceConfiguration(id: ID!, assignments: [JSON]!): Boolean
  createDeviceCompliancePolicy(input: JSON): DeviceCompliancePolicy
  updateDeviceCompliancePolicy(id: ID!, input: JSON): DeviceCompliancePolicy
  deleteDeviceCompliancePolicy(id: ID!): Boolean
  createMobileApp(input: JSON): MobileApp
  updateMobileApp(id: ID!, input: JSON): MobileApp
  deleteMobileApp(id: ID!): Boolean
  assignMobileApp(id: ID!, assignments: [JSON]!): Boolean

  # DevOps
  createRepository(projectId: ID!, name: String!, defaultBranch: String): Repository
  updateRepository(id: ID!, input: JSON): Repository
  deleteRepository(id: ID!): Boolean
  createPullRequest(repositoryId: ID!, input: JSON): PullRequest
  updatePullRequest(repositoryId: ID!, pullRequestId: ID!, input: JSON): PullRequest
  abandonPullRequest(repositoryId: ID!, pullRequestId: ID!): PullRequest
  completePullRequest(repositoryId: ID!, pullRequestId: ID!): PullRequest
  createWorkItem(projectId: ID!, type: String!, title: String!, fields: JSON): WorkItem
  updateWorkItem(id: ID!, fields: JSON): WorkItem
  createPipeline(projectId: ID!, input: JSON): Pipeline
  runPipeline(pipelineId: ID!, input: JSON): PipelineRun
}

# ---------------------------------------------------------------------------
# Subscriptions (conceptual — via Graph change notifications / webhooks)
# ---------------------------------------------------------------------------

type Subscription {
  messageReceived(userId: ID!): Message
  calendarEventChanged(userId: ID!): Event
  teamChannelMessagePosted(teamId: ID!, channelId: ID!): ChannelMessage
  userUpdated(userId: ID!): User
  securityAlertCreated: SecurityAlert
  deviceComplianceChanged(deviceId: ID!): ManagedDevice
  auditLogCreated: AuditLogRecord
}
