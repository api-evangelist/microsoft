}

input WebApplicationInput {
  redirectUris: [String]
  logoutUrl: String
}

input SpaApplicationInput {
  redirectUris: [String]
}

input RequiredResourceAccessInput {
  resourceAppId: ID!
  resourceAccess: [ResourceAccessInput]!
}

input ResourceAccessInput {
  id: ID!
  type: String!
}

input AssignLicenseInput {
  addLicenses: [AssignedLicenseInput]
  removeLicenses: [ID]
}

