  oauth2PermissionGrants(filter: String): [OAuth2PermissionGrant]

  # Conditional Access
  conditionalAccessPolicy(id: ID!): ConditionalAccessPolicy
  conditionalAccessPolicies: [ConditionalAccessPolicy]

  # Security
  securityAlert(id: ID!): SecurityAlert
  securityAlerts(filter: String, top: Int, skip: Int, orderBy: String): [SecurityAlert]
  secureScore: SecureScore
  secureScores(top: Int): [SecureScore]
  secureScoreControlProfile(id: ID!): SecureScoreControlProfile
  secureScoreControlProfiles: [SecureScoreControlProfile]
  riskyUser(id: ID!): RiskyUser
  riskyUsers(filter: String, top: Int, orderBy: String): [RiskyUser]
  riskySignIn(id: ID!): RiskySignIn
  riskySignIns(filter: String, top: Int, orderBy: String): [RiskySignIn]
  identityRiskEvent(id: ID!): IdentityRiskEvent
  identityRiskEvents(filter: String, top: Int, orderBy: String): [IdentityRiskEvent]
  auditLogRecord(id: ID!): AuditLogRecord
  auditLogs(filter: String, top: Int, skip: Int, orderBy: String): [AuditLogRecord]
  signInRecord(id: ID!): SignInRecord
  signInLogs(filter: String, top: Int, skip: Int, orderBy: String): [SignInRecord]
  threatIntelligence(id: ID!): ThreatIntelligence
  threatIntelligences(filter: String, top: Int): [ThreatIntelligence]

  # Intune
  managedDevice(id: ID!): ManagedDevice
  managedDevices(filter: String, top: Int, skip: Int, orderBy: String): [ManagedDevice]
  deviceConfiguration(id: ID!): DeviceConfiguration
  deviceConfigurations: [DeviceConfiguration]
  deviceCompliancePolicy(id: ID!): DeviceCompliancePolicy
  deviceCompliancePolicies: [DeviceCompliancePolicy]
  mobileApp(id: ID!): MobileApp
  mobileApps(filter: String, top: Int, skip: Int): [MobileApp]
  appConfiguration(id: ID!): AppConfiguration
  appConfigurations: [AppConfiguration]
  detectedApp(id: ID!): DetectedApp
  detectedApps(filter: String, top: Int): [DetectedApp]
  deviceEnrollmentConfiguration(id: ID!): DeviceEnrollmentConfiguration
  deviceEnrollmentConfigurations: [DeviceEnrollmentConfiguration]

  # DevOps
  repository(id: ID!): Repository
  repositories(projectId: ID!, filter: String): [Repository]
  pullRequest(repositoryId: ID!, pullRequestId: ID!): PullRequest
  pullRequests(repositoryId: ID!, status: PullRequestStatus, top: Int): [PullRequest]
  build(id: ID!): Build
  builds(projectId: ID!, filter: String, top: Int): [Build]
  pipeline(id: ID!): Pipeline
  pipelines(projectId: ID!): [Pipeline]
  pipelineRun(pipelineId: ID!, runId: ID!): PipelineRun
  pipelineRuns(pipelineId: ID!, top: Int): [PipelineRun]
  release(id: ID!): Release
  releases(projectId: ID!, top: Int): [Release]
  testPlan(id: ID!): TestPlan
  testPlans(projectId: ID!): [TestPlan]
  workItem(id: ID!): WorkItem
  workItems(projectId: ID!, wiql: String, top: Int): [WorkItem]
  devOpsProject(id: ID!): DevOpsProject
  devOpsProjects(top: Int): [DevOpsProject]
}

# ---------------------------------------------------------------------------
# Input Types
# ---------------------------------------------------------------------------

input CreateUserInput {
  displayName: String!
  userPrincipalName: String!
  mailNickname: String!
  accountEnabled: Boolean
  passwordProfile: PasswordProfileInput
  jobTitle: String
  department: String
  officeLocation: String
  mobilePhone: String
  usageLocation: String
}

input PasswordProfileInput {
  password: String!
  forceChangePasswordNextSignIn: Boolean
}

input UpdateUserInput {
  displayName: String
  jobTitle: String
  department: String
  officeLocation: String
  mobilePhone: String
  businessPhones: [String]
  accountEnabled: Boolean
  usageLocation: String
  preferredLanguage: String
}

input CreateGroupInput {
  displayName: String!
  mailNickname: String!
  description: String
  mailEnabled: Boolean!
  securityEnabled: Boolean!
  groupTypes: [GroupType]
  visibility: String
}

input CreateTeamInput {
  displayName: String!
  description: String
  visibility: String
  memberSettings: JSON
  guestSettings: JSON
  messagingSettings: JSON
  funSettings: JSON
}

input CreateChannelInput {
  displayName: String!
  description: String
  membershipType: ChannelMembershipType
}

input MessageInput {
  body: ItemBodyInput!
  subject: String
  importance: String
  attachments: [AttachmentInput]
  mentions: [MentionInput]
}

input ItemBodyInput {
  contentType: BodyType!
  content: String!
}

input AttachmentInput {
  name: String!
  contentType: String
  contentUrl: String
  content: String
}

input MentionInput {
  id: Int!
  mentionText: String!
  mentioned: IdentitySetInput!
}

input IdentitySetInput {
  user: IdentityInput
  application: IdentityInput
  device: IdentityInput
}

input IdentityInput {
  id: ID
  displayName: String
}

input CreateEventInput {
  subject: String!
  body: ItemBodyInput
  start: DateTimeTimeZoneInput!
  end: DateTimeTimeZoneInput!
  location: LocationInput
  attendees: [AttendeeInput]
  isAllDay: Boolean
  importance: EventImportance
  sensitivity: String
  showAs: EventStatus
  recurrence: PatternedRecurrenceInput
  isOnlineMeeting: Boolean
  onlineMeetingProvider: String
}

input DateTimeTimeZoneInput {
  dateTime: DateTime!
  timeZone: String!
}

input LocationInput {
  displayName: String!
  locationUri: String
  address: PhysicalAddressInput
}

input PhysicalAddressInput {
  street: String
  city: String
  state: String
  countryOrRegion: String
  postalCode: String
}

input AttendeeInput {
  emailAddress: EmailAddressInput!
  type: AttendeeType
}

input EmailAddressInput {
  address: String!
  name: String
}

input PatternedRecurrenceInput {
  pattern: RecurrencePatternInput!
  range: RecurrenceRangeInput!
}

input RecurrencePatternInput {
  type: String!
  interval: Int!
  daysOfWeek: [String]
  dayOfMonth: Int
  month: Int
}

input RecurrenceRangeInput {
  type: String!
  startDate: Date!
  endDate: Date
  numberOfOccurrences: Int
}

input UpdateEventInput {
  subject: String
  body: ItemBodyInput
  start: DateTimeTimeZoneInput
  end: DateTimeTimeZoneInput
  location: LocationInput
  attendees: [AttendeeInput]
  isAllDay: Boolean
  importance: EventImportance
  showAs: EventStatus
  recurrence: PatternedRecurrenceInput
}

input SendMailInput {
  message: MessageDraftInput!
  saveToSentItems: Boolean
}

input MessageDraftInput {
  subject: String!
  body: ItemBodyInput!
  toRecipients: [RecipientInput]!
  ccRecipients: [RecipientInput]
  bccRecipients: [RecipientInput]
  attachments: [AttachmentInput]
  importance: String
}

input RecipientInput {
  emailAddress: EmailAddressInput!
}

input CreatePlannerPlanInput {
  title: String!
  owner: ID!
}

input CreatePlannerTaskInput {
  planId: ID!
  title: String!
  bucketId: ID
  dueDateTime: DateTime
  assignments: JSON
}

input CreateTodoTaskInput {
  title: String!
