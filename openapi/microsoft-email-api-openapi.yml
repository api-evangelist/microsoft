openapi: 3.2.0
info:
  title: Microsoft Azure Communication Services Email API
  description: Multichannel communication APIs for adding voice, video, chat, SMS, and email capabilities to applications.
  version: '2024-03-15'
  contact:
    name: Azure Communication Services Support
    url: https://learn.microsoft.com/en-us/azure/communication-services/
  termsOfService: https://www.microsoft.com/en-us/legal/terms-of-use
servers:
- url: https://{resource}.communication.azure.com
  description: Azure Communication Services Endpoint
  variables:
    resource:
      default: your-resource
      description: Your Communication Services resource name
security:
- accessKey: []
tags:
- name: Email
  description: Send email messages
paths:
  /emails:send:
    post:
      operationId: sendEmail
      summary: Microsoft Send an email
      description: Queues an email message for sending.
      tags:
      - Email
      parameters:
      - $ref: '#/components/parameters/apiVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailMessage'
      responses:
        '202':
          description: Email accepted for delivery
          headers:
            Operation-Location:
              schema:
                type: string
              description: URL to poll for send status
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
                    enum:
                    - NotStarted
                    - Running
                    - Succeeded
                    - Failed
                    - Canceled
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
components:
  schemas:
    EmailMessage:
      type: object
      required:
      - senderAddress
      - recipients
      - content
      properties:
        senderAddress:
          type: string
          description: Sender email address
        recipients:
          type: object
          required:
          - to
          properties:
            to:
              type: array
              items:
                type: object
                required:
                - address
                properties:
                  address:
                    type: string
                  displayName:
                    type: string
            cc:
              type: array
              items:
                type: object
                properties:
                  address:
                    type: string
                  displayName:
                    type: string
            bcc:
              type: array
              items:
                type: object
                properties:
                  address:
                    type: string
                  displayName:
                    type: string
        content:
          type: object
          required:
          - subject
          properties:
            subject:
              type: string
            plainText:
              type: string
            html:
              type: string
  parameters:
    apiVersion:
      name: api-version
      in: query
      required: true
      description: API version
      schema:
        type: string
        default: 2024-03-15-preview
  securitySchemes:
    accessKey:
      type: apiKey
      name: Authorization
      in: header
      description: HMAC-SHA256 signature authentication
externalDocs:
  description: Azure Communication Services REST API Reference
  url: https://learn.microsoft.com/en-us/rest/api/communication/
