openapi: 3.2.0
info:
  title: Microsoft Dynamics 365 REST Opportunities API
  description: REST APIs for Dynamics 365 business applications including Customer Engagement and Dataverse Web API for managing accounts, contacts, opportunities, and custom entities.
  version: '9.2'
  contact:
    name: Dynamics 365 Support
    url: https://learn.microsoft.com/en-us/rest/dynamics365/
  termsOfService: https://www.microsoft.com/en-us/legal/terms-of-use
servers:
- url: https://{org}.api.crm.dynamics.com/api/data/v9.2
  description: Dynamics 365 Dataverse Web API
  variables:
    org:
      default: your-org
      description: Your Dynamics 365 organization name
security:
- oauth2: []
tags:
- name: Opportunities
  description: Manage sales opportunities
paths:
  /opportunities:
    get:
      operationId: listOpportunities
      summary: Microsoft List opportunities
      description: Retrieve a list of opportunity records.
      tags:
      - Opportunities
      parameters:
      - $ref: '#/components/parameters/select'
      - $ref: '#/components/parameters/filter'
      - $ref: '#/components/parameters/top'
      - $ref: '#/components/parameters/orderby'
      responses:
        '200':
          description: List of opportunities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityCollection'
        '401':
          description: Unauthorized
    post:
      operationId: createOpportunity
      summary: Microsoft Create an opportunity
      description: Create a new opportunity record.
      tags:
      - Opportunities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Opportunity'
      responses:
        '204':
          description: Opportunity created
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
components:
  parameters:
    top:
      name: $top
      in: query
      description: Maximum number of records to return
      schema:
        type: integer
    filter:
      name: $filter
      in: query
      description: OData filter expression
      schema:
        type: string
    orderby:
      name: $orderby
      in: query
      description: Sort order
      schema:
        type: string
    select:
      name: $select
      in: query
      description: Properties to include
      schema:
        type: string
  schemas:
    Opportunity:
      type: object
      properties:
        opportunityid:
          type: string
          format: uuid
        name:
          type: string
        estimatedvalue:
          type: number
        estimatedclosedate:
          type: string
          format: date
        stepname:
          type: string
        description:
          type: string
        statecode:
          type: integer
        statuscode:
          type: integer
    EntityCollection:
      type: object
      properties:
        '@odata.context':
          type: string
        '@odata.nextLink':
          type: string
        value:
          type: array
          items:
            type: object
  securitySchemes:
    oauth2:
      type: oauth2
      description: Microsoft Entra ID OAuth 2.0
      flows:
        authorizationCode:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
          tokenUrl: https://login.microsoftonline.com/common/oauth2/v2.0/token
          scopes:
            https://org.api.crm.dynamics.com/.default: Access Dynamics 365
externalDocs:
  description: Dynamics 365 REST API Reference
  url: https://learn.microsoft.com/en-us/rest/dynamics365/
