openapi: 3.2.0
info:
  title: Microsoft Azure OpenAI Service Embeddings API
  description: Access to OpenAI's powerful language models through Azure including chat completions, completions, embeddings, image generation, and audio transcription and translation services.
  version: '2024-10-21'
  contact:
    name: Microsoft Azure Support
    url: https://azure.microsoft.com/en-us/support/
  termsOfService: https://www.microsoft.com/en-us/legal/terms-of-use
servers:
- url: https://{resource-name}.openai.azure.com/openai
  description: Azure OpenAI Service Endpoint
  variables:
    resource-name:
      default: your-resource-name
      description: Your Azure OpenAI resource name
security:
- apiKey: []
- oauth2: []
tags:
- name: Embeddings
  description: Create vector embeddings from text
paths:
  /deployments/{deployment-id}/embeddings:
    post:
      operationId: createEmbedding
      summary: Microsoft Create embeddings
      description: Get a vector representation of a given input that can be consumed by machine learning models and algorithms.
      tags:
      - Embeddings
      parameters:
      - $ref: '#/components/parameters/deploymentId'
      - $ref: '#/components/parameters/apiVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingRequest'
      responses:
        '200':
          description: Embedding response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingResponse'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '429':
          description: Rate limit exceeded
components:
  schemas:
    EmbeddingResponse:
      type: object
      properties:
        object:
          type: string
          enum:
          - list
        data:
          type: array
          items:
            type: object
            properties:
              object:
                type: string
                enum:
                - embedding
              embedding:
                type: array
                items:
                  type: number
              index:
                type: integer
        model:
          type: string
        usage:
          type: object
          properties:
            prompt_tokens:
              type: integer
            total_tokens:
              type: integer
    EmbeddingRequest:
      type: object
      required:
      - input
      properties:
        input:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
          description: Input text to embed
        encoding_format:
          type: string
          enum:
          - float
          - base64
          default: float
  parameters:
    apiVersion:
      name: api-version
      in: query
      required: true
      description: The API version to use
      schema:
        type: string
        default: '2024-10-21'
    deploymentId:
      name: deployment-id
      in: path
      required: true
      description: The deployment name for the model
      schema:
        type: string
  securitySchemes:
    apiKey:
      type: apiKey
      name: api-key
      in: header
      description: Azure OpenAI API key
    oauth2:
      type: oauth2
      description: Microsoft Entra ID OAuth 2.0
      flows:
        clientCredentials:
          tokenUrl: https://login.microsoftonline.com/{tenantId}/oauth2/v2.0/token
          scopes:
            https://cognitiveservices.azure.com/.default: Access Azure OpenAI
externalDocs:
  description: Azure OpenAI Service REST API Reference
  url: https://learn.microsoft.com/en-us/azure/ai-services/openai/reference
