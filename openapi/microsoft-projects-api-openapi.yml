openapi: 3.2.0
info:
  title: Microsoft Azure DevOps REST Projects API
  description: REST APIs for managing Azure DevOps Services including projects, Git repositories, pipelines, builds, and work items.
  version: '7.2'
  contact:
    name: Azure DevOps Support
    url: https://learn.microsoft.com/en-us/rest/api/azure/devops/
  termsOfService: https://www.microsoft.com/en-us/legal/terms-of-use
servers:
- url: https://dev.azure.com/{organization}
  description: Azure DevOps Services
  variables:
    organization:
      default: your-org
      description: Your Azure DevOps organization name
security:
- basicAuth: []
- oauth2: []
tags:
- name: Projects
  description: Manage team projects
paths:
  /_apis/projects:
    get:
      operationId: listProjects
      summary: Microsoft List projects
      description: Get all projects in the organization.
      tags:
      - Projects
      parameters:
      - $ref: '#/components/parameters/apiVersion'
      - name: $top
        in: query
        description: Maximum number of projects to return
        schema:
          type: integer
      - name: $skip
        in: query
        description: Number of projects to skip
        schema:
          type: integer
      - name: stateFilter
        in: query
        description: Filter on team project state
        schema:
          type: string
          enum:
          - all
          - createPending
          - deleted
          - deleting
          - new
          - unchanged
          - wellFormed
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCollection'
        '401':
          description: Unauthorized
    post:
      operationId: createProject
      summary: Microsoft Create a project
      description: Queue a project creation operation.
      tags:
      - Projects
      parameters:
      - $ref: '#/components/parameters/apiVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '202':
          description: Project creation queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationReference'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
  /_apis/projects/{projectId}:
    get:
      operationId: getProject
      summary: Microsoft Get a project
      description: Get project with the specified id or name.
      tags:
      - Projects
      parameters:
      - $ref: '#/components/parameters/projectId'
      - $ref: '#/components/parameters/apiVersion'
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          description: Unauthorized
        '404':
          description: Project not found
components:
  parameters:
    projectId:
      name: projectId
      in: path
      required: true
      description: Project ID or name
      schema:
        type: string
    apiVersion:
      name: api-version
      in: query
      required: true
      description: Version of the API to use
      schema:
        type: string
        default: 7.2-preview.4
  schemas:
    ProjectCollection:
      type: object
      properties:
        count:
          type: integer
        value:
          type: array
          items:
            $ref: '#/components/schemas/Project'
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        url:
          type: string
        state:
          type: string
          enum:
          - all
          - createPending
          - deleted
          - deleting
          - new
          - unchanged
          - wellFormed
        visibility:
          type: string
          enum:
          - private
          - public
        lastUpdateTime:
          type: string
          format: date-time
    OperationReference:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        url:
          type: string
    CreateProjectRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        description:
          type: string
        visibility:
          type: string
          enum:
          - private
          - public
        capabilities:
          type: object
          properties:
            versioncontrol:
              type: object
              properties:
                sourceControlType:
                  type: string
                  enum:
                  - Git
                  - Tfvc
            processTemplate:
              type: object
              properties:
                templateTypeId:
                  type: string
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Personal Access Token (PAT) as password with empty username
    oauth2:
      type: oauth2
      description: Microsoft Entra ID OAuth 2.0
      flows:
        authorizationCode:
          authorizationUrl: https://app.vssps.visualstudio.com/oauth2/authorize
          tokenUrl: https://app.vssps.visualstudio.com/oauth2/token
          scopes:
            vso.project: Read projects
            vso.code: Read source code
            vso.build_execute: Execute builds
            vso.work_write: Read and write work items
externalDocs:
  description: Azure DevOps REST API Reference
  url: https://learn.microsoft.com/en-us/rest/api/azure/devops/
