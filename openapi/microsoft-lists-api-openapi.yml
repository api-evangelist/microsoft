openapi: 3.2.0
info:
  title: Microsoft Azure Cognitive Services Accounts Lists API
  description: APIs for vision, speech, language, and decision-making AI capabilities including Computer Vision, Text Analytics, and Translator services.
  version: '3.2'
  contact:
    name: Microsoft Azure Support
    url: https://azure.microsoft.com/en-us/support/
  termsOfService: https://www.microsoft.com/en-us/legal/terms-of-use
servers:
- url: https://{region}.api.cognitive.microsoft.com
  description: Azure Cognitive Services Regional Endpoint
  variables:
    region:
      default: eastus
      description: Azure region for the Cognitive Services resource
security:
- apiKey: []
tags:
- name: Lists
  description: Manage SharePoint lists
paths:
  /web/lists:
    get:
      operationId: listLists
      summary: Microsoft List all lists
      description: Get all lists in the current SharePoint site.
      tags:
      - Lists
      responses:
        '200':
          description: List of SharePoint lists
          content:
            application/json:
              schema:
                type: object
                properties:
                  d:
                    type: object
                    properties:
                      results:
                        type: array
                        items:
                          $ref: '#/components/schemas/SPList'
        '401':
          description: Unauthorized
  /web/lists/getbytitle('{listTitle}'):
    get:
      operationId: getListByTitle
      summary: Microsoft Get list by title
      description: Get a SharePoint list by its title.
      tags:
      - Lists
      parameters:
      - name: listTitle
        in: path
        required: true
        description: Title of the list
        schema:
          type: string
      responses:
        '200':
          description: List details
          content:
            application/json:
              schema:
                type: object
                properties:
                  d:
                    $ref: '#/components/schemas/SPList'
        '401':
          description: Unauthorized
        '404':
          description: List not found
components:
  schemas:
    SPList:
      type: object
      properties:
        Id:
          type: string
        Title:
          type: string
          description: Title of the list
        Description:
          type: string
        ItemCount:
          type: integer
          description: Number of items in the list
        Created:
          type: string
          format: date-time
        LastItemModifiedDate:
          type: string
          format: date-time
        Hidden:
          type: boolean
        BaseTemplate:
          type: integer
          description: List template type
        ListItemEntityTypeFullName:
          type: string
  securitySchemes:
    apiKey:
      type: apiKey
      name: Ocp-Apim-Subscription-Key
      in: header
      description: Azure Cognitive Services subscription key
externalDocs:
  description: Azure AI Services Documentation
  url: https://learn.microsoft.com/en-us/azure/ai-services/
