openapi: 3.2.0
info:
  title: Microsoft Azure DevOps REST Pipelines API
  description: REST APIs for managing Azure DevOps Services including projects, Git repositories, pipelines, builds, and work items.
  version: '7.2'
  contact:
    name: Azure DevOps Support
    url: https://learn.microsoft.com/en-us/rest/api/azure/devops/
  termsOfService: https://www.microsoft.com/en-us/legal/terms-of-use
servers:
- url: https://dev.azure.com/{organization}
  description: Azure DevOps Services
  variables:
    organization:
      default: your-org
      description: Your Azure DevOps organization name
security:
- basicAuth: []
- oauth2: []
tags:
- name: Pipelines
  description: Manage build and release pipelines
paths:
  /{project}/_apis/pipelines:
    get:
      operationId: listPipelines
      summary: Microsoft List pipelines
      description: Get a list of pipelines for a project.
      tags:
      - Pipelines
      parameters:
      - $ref: '#/components/parameters/project'
      - $ref: '#/components/parameters/apiVersion'
      - name: $top
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: List of pipelines
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineCollection'
        '401':
          description: Unauthorized
  /{project}/_apis/pipelines/{pipelineId}/runs:
    post:
      operationId: runPipeline
      summary: Microsoft Run a pipeline
      description: Runs a pipeline.
      tags:
      - Pipelines
      parameters:
      - $ref: '#/components/parameters/project'
      - name: pipelineId
        in: path
        required: true
        description: Pipeline ID
        schema:
          type: integer
      - $ref: '#/components/parameters/apiVersion'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                resources:
                  type: object
                  properties:
                    repositories:
                      type: object
                      properties:
                        self:
                          type: object
                          properties:
                            refName:
                              type: string
      responses:
        '200':
          description: Pipeline run started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineRun'
        '401':
          description: Unauthorized
components:
  parameters:
    project:
      name: project
      in: path
      required: true
      description: Project ID or name
      schema:
        type: string
    apiVersion:
      name: api-version
      in: query
      required: true
      description: Version of the API to use
      schema:
        type: string
        default: 7.2-preview.4
  schemas:
    PipelineRun:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        state:
          type: string
          enum:
          - canceling
          - completed
          - inProgress
          - unknown
        result:
          type: string
          enum:
          - canceled
          - failed
          - succeeded
          - unknown
        createdDate:
          type: string
          format: date-time
        finishedDate:
          type: string
          format: date-time
        url:
          type: string
        pipeline:
          $ref: '#/components/schemas/Pipeline'
    PipelineCollection:
      type: object
      properties:
        count:
          type: integer
        value:
          type: array
          items:
            $ref: '#/components/schemas/Pipeline'
    Pipeline:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        url:
          type: string
        folder:
          type: string
        revision:
          type: integer
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Personal Access Token (PAT) as password with empty username
    oauth2:
      type: oauth2
      description: Microsoft Entra ID OAuth 2.0
      flows:
        authorizationCode:
          authorizationUrl: https://app.vssps.visualstudio.com/oauth2/authorize
          tokenUrl: https://app.vssps.visualstudio.com/oauth2/token
          scopes:
            vso.project: Read projects
            vso.code: Read source code
            vso.build_execute: Execute builds
            vso.work_write: Read and write work items
externalDocs:
  description: Azure DevOps REST API Reference
  url: https://learn.microsoft.com/en-us/rest/api/azure/devops/
