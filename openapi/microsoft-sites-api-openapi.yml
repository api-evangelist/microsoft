openapi: 3.2.0
info:
  title: Microsoft Azure Cognitive Services Accounts Sites API
  description: APIs for vision, speech, language, and decision-making AI capabilities including Computer Vision, Text Analytics, and Translator services.
  version: '3.2'
  contact:
    name: Microsoft Azure Support
    url: https://azure.microsoft.com/en-us/support/
  termsOfService: https://www.microsoft.com/en-us/legal/terms-of-use
servers:
- url: https://{region}.api.cognitive.microsoft.com
  description: Azure Cognitive Services Regional Endpoint
  variables:
    region:
      default: eastus
      description: Azure region for the Cognitive Services resource
security:
- apiKey: []
tags:
- name: Sites
  description: Access SharePoint sites via Microsoft Graph
paths:
  /web:
    get:
      operationId: getWeb
      summary: Microsoft Get current web
      description: Get the properties of the current SharePoint site.
      tags:
      - Sites
      responses:
        '200':
          description: Web properties
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Web'
        '401':
          description: Unauthorized
components:
  schemas:
    Web:
      type: object
      properties:
        Id:
          type: string
        Title:
          type: string
          description: Title of the site
        Description:
          type: string
        Url:
          type: string
        Created:
          type: string
          format: date-time
        Language:
          type: integer
        WebTemplate:
          type: string
  securitySchemes:
    apiKey:
      type: apiKey
      name: Ocp-Apim-Subscription-Key
      in: header
      description: Azure Cognitive Services subscription key
externalDocs:
  description: Azure AI Services Documentation
  url: https://learn.microsoft.com/en-us/azure/ai-services/
