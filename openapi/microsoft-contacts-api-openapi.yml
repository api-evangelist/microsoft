openapi: 3.2.0
info:
  title: Microsoft Contacts API
  termsOfService: https://www.microsoft.com/en-us/legal/terms-of-use
  version: '1.0'
  description: 'Operations tagged Contacts across 2 of this provider''s published API definitions: microsoft-dynamics-365-openapi.yml, microsoft-outlook-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{org}.api.crm.dynamics.com/api/data/v9.2
  description: Dynamics 365 Dataverse Web API
  variables:
    org:
      default: your-org
      description: Your Dynamics 365 organization name
- url: https://graph.microsoft.com/v1.0/me
  description: Microsoft Graph v1.0 (current user context)
security:
- oauth2: []
tags:
- name: Contacts
  description: Manage contacts
paths:
  /contacts:
    get:
      operationId: listContacts
      summary: Microsoft List contacts
      description: Retrieve a list of contact records.
      tags:
      - Contacts
      parameters:
      - $ref: '#/components/parameters/select'
      - $ref: '#/components/parameters/filter'
      - $ref: '#/components/parameters/top'
      - $ref: '#/components/parameters/orderby'
      responses:
        '200':
          description: List of contacts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityCollection'
        '401':
          description: Unauthorized
    post:
      operationId: createContact
      summary: Microsoft Create a contact
      description: Create a new contact record.
      tags:
      - Contacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Contact'
      responses:
        '204':
          description: Contact created
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
    servers:
    - url: https://{org}.api.crm.dynamics.com/api/data/v9.2
      description: Dynamics 365 Dataverse Web API
      variables:
        org:
          default: your-org
          description: Your Dynamics 365 organization name
components:
  parameters:
    top:
      name: $top
      in: query
      description: Maximum number of records to return
      schema:
        type: integer
    filter:
      name: $filter
      in: query
      description: OData filter expression
      schema:
        type: string
    orderby:
      name: $orderby
      in: query
      description: Sort order
      schema:
        type: string
    select:
      name: $select
      in: query
      description: Properties to include
      schema:
        type: string
    top_2:
      name: $top
      in: query
      schema:
        type: integer
    filter_2:
      name: $filter
      in: query
      schema:
        type: string
    orderby_2:
      name: $orderby
      in: query
      schema:
        type: string
    select_2:
      name: $select
      in: query
      schema:
        type: string
  schemas:
    Contact:
      type: object
      properties:
        contactid:
          type: string
          format: uuid
        firstname:
          type: string
        lastname:
          type: string
        fullname:
          type: string
        emailaddress1:
          type: string
        telephone1:
          type: string
        jobtitle:
          type: string
        address1_city:
          type: string
        address1_stateorprovince:
          type: string
        statecode:
          type: integer
    EntityCollection:
      type: object
      properties:
        '@odata.context':
          type: string
        '@odata.nextLink':
          type: string
        value:
          type: array
          items:
            type: object
    Contact_2:
      type: object
      properties:
        id:
          type: string
        displayName:
          type: string
        givenName:
          type: string
        surname:
          type: string
        emailAddresses:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              address:
                type: string
        businessPhones:
          type: array
          items:
            type: string
        mobilePhone:
          type: string
        companyName:
          type: string
        jobTitle:
          type: string
  securitySchemes:
    oauth2:
      type: oauth2
      description: Microsoft Entra ID OAuth 2.0
      flows:
        authorizationCode:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
          tokenUrl: https://login.microsoftonline.com/common/oauth2/v2.0/token
          scopes:
            https://org.api.crm.dynamics.com/.default: Access Dynamics 365
x-refined-from:
- microsoft-dynamics-365-openapi.yml
- microsoft-outlook-openapi.yml
