openapi: 3.2.0
info:
  title: Microsoft Azure DevOps REST Work Items API
  description: REST APIs for managing Azure DevOps Services including projects, Git repositories, pipelines, builds, and work items.
  version: '7.2'
  contact:
    name: Azure DevOps Support
    url: https://learn.microsoft.com/en-us/rest/api/azure/devops/
  termsOfService: https://www.microsoft.com/en-us/legal/terms-of-use
servers:
- url: https://dev.azure.com/{organization}
  description: Azure DevOps Services
  variables:
    organization:
      default: your-org
      description: Your Azure DevOps organization name
security:
- basicAuth: []
- oauth2: []
tags:
- name: Work Items
  description: Manage work items and queries
paths:
  /{project}/_apis/wit/workitems/${type}:
    post:
      operationId: createWorkItem
      summary: Microsoft Create a work item
      description: Creates a single work item.
      tags:
      - Work Items
      parameters:
      - $ref: '#/components/parameters/project'
      - name: type
        in: path
        required: true
        description: Work item type (e.g., Bug, Task, User Story)
        schema:
          type: string
      - $ref: '#/components/parameters/apiVersion'
      requestBody:
        required: true
        content:
          application/json-patch+json:
            schema:
              type: array
              items:
                type: object
                properties:
                  op:
                    type: string
                    enum:
                    - add
                    - replace
                    - remove
                    - test
                  path:
                    type: string
                  value:
                    type: string
      responses:
        '200':
          description: Work item created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItem'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
  /{project}/_apis/wit/workitems/{id}:
    get:
      operationId: getWorkItem
      summary: Microsoft Get a work item
      description: Returns a single work item.
      tags:
      - Work Items
      parameters:
      - $ref: '#/components/parameters/project'
      - name: id
        in: path
        required: true
        description: Work item ID
        schema:
          type: integer
      - $ref: '#/components/parameters/apiVersion'
      - name: $expand
        in: query
        description: Expand work item relationships
        schema:
          type: string
          enum:
          - None
          - Relations
          - Fields
          - Links
          - All
      responses:
        '200':
          description: Work item details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItem'
        '401':
          description: Unauthorized
        '404':
          description: Work item not found
components:
  schemas:
    WorkItem:
      type: object
      properties:
        id:
          type: integer
        rev:
          type: integer
        fields:
          type: object
          properties:
            System.Title:
              type: string
            System.State:
              type: string
            System.WorkItemType:
              type: string
            System.AssignedTo:
              type: object
              properties:
                displayName:
                  type: string
                uniqueName:
                  type: string
            System.Description:
              type: string
            System.CreatedDate:
              type: string
              format: date-time
            System.ChangedDate:
              type: string
              format: date-time
        url:
          type: string
  parameters:
    apiVersion:
      name: api-version
      in: query
      required: true
      description: Version of the API to use
      schema:
        type: string
        default: 7.2-preview.4
    project:
      name: project
      in: path
      required: true
      description: Project ID or name
      schema:
        type: string
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Personal Access Token (PAT) as password with empty username
    oauth2:
      type: oauth2
      description: Microsoft Entra ID OAuth 2.0
      flows:
        authorizationCode:
          authorizationUrl: https://app.vssps.visualstudio.com/oauth2/authorize
          tokenUrl: https://app.vssps.visualstudio.com/oauth2/token
          scopes:
            vso.project: Read projects
            vso.code: Read source code
            vso.build_execute: Execute builds
            vso.work_write: Read and write work items
externalDocs:
  description: Azure DevOps REST API Reference
  url: https://learn.microsoft.com/en-us/rest/api/azure/devops/
