openapi: 3.2.0
info:
  title: Microsoft Azure DevOps REST Git API
  description: REST APIs for managing Azure DevOps Services including projects, Git repositories, pipelines, builds, and work items.
  version: '7.2'
  contact:
    name: Azure DevOps Support
    url: https://learn.microsoft.com/en-us/rest/api/azure/devops/
  termsOfService: https://www.microsoft.com/en-us/legal/terms-of-use
servers:
- url: https://dev.azure.com/{organization}
  description: Azure DevOps Services
  variables:
    organization:
      default: your-org
      description: Your Azure DevOps organization name
security:
- basicAuth: []
- oauth2: []
tags:
- name: Git
  description: Manage Git repositories
paths:
  /{project}/_apis/git/repositories:
    get:
      operationId: listRepositories
      summary: Microsoft List repositories
      description: Retrieve git repositories for a project.
      tags:
      - Git
      parameters:
      - $ref: '#/components/parameters/project'
      - $ref: '#/components/parameters/apiVersion'
      responses:
        '200':
          description: List of repositories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryCollection'
        '401':
          description: Unauthorized
    post:
      operationId: createRepository
      summary: Microsoft Create a repository
      description: Create a git repository in a team project.
      tags:
      - Git
      parameters:
      - $ref: '#/components/parameters/project'
      - $ref: '#/components/parameters/apiVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Repository created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Repository'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
components:
  schemas:
    Repository:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        url:
          type: string
        defaultBranch:
          type: string
        size:
          type: integer
          format: int64
        remoteUrl:
          type: string
        webUrl:
          type: string
        project:
          $ref: '#/components/schemas/Project'
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        url:
          type: string
        state:
          type: string
          enum:
          - all
          - createPending
          - deleted
          - deleting
          - new
          - unchanged
          - wellFormed
        visibility:
          type: string
          enum:
          - private
          - public
        lastUpdateTime:
          type: string
          format: date-time
    RepositoryCollection:
      type: object
      properties:
        count:
          type: integer
        value:
          type: array
          items:
            $ref: '#/components/schemas/Repository'
  parameters:
    project:
      name: project
      in: path
      required: true
      description: Project ID or name
      schema:
        type: string
    apiVersion:
      name: api-version
      in: query
      required: true
      description: Version of the API to use
      schema:
        type: string
        default: 7.2-preview.4
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Personal Access Token (PAT) as password with empty username
    oauth2:
      type: oauth2
      description: Microsoft Entra ID OAuth 2.0
      flows:
        authorizationCode:
          authorizationUrl: https://app.vssps.visualstudio.com/oauth2/authorize
          tokenUrl: https://app.vssps.visualstudio.com/oauth2/token
          scopes:
            vso.project: Read projects
            vso.code: Read source code
            vso.build_execute: Execute builds
            vso.work_write: Read and write work items
externalDocs:
  description: Azure DevOps REST API Reference
  url: https://learn.microsoft.com/en-us/rest/api/azure/devops/
