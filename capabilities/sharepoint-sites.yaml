naftiko: 1.0.0-alpha2
info:
  label: Microsoft SharePoint REST API — Sites
  description: 'Microsoft SharePoint REST API — Sites. 1 operations. Lead operation: Microsoft Get current web. Self-contained
    Naftiko capability covering one Microsoft business surface.'
  tags:
  - Microsoft
  - Sites
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_API_KEY: MICROSOFT_API_KEY
capability:
  consumes:
  - type: http
    namespace: sharepoint-sites
    baseUri: https://{tenant}.sharepoint.com/_api
    description: Microsoft SharePoint REST API — Sites business capability. Self-contained, no shared references.
    resources:
    - name: web
      path: /web
      operations:
      - name: getweb
        method: GET
        description: Microsoft Get current web
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.MICROSOFT_API_KEY}}'
  exposes:
  - type: rest
    namespace: sharepoint-sites-rest
    port: 8080
    description: REST adapter for Microsoft SharePoint REST API — Sites. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/web
      name: web
      description: REST surface for web.
      operations:
      - method: GET
        name: getweb
        description: Microsoft Get current web
        call: sharepoint-sites.getweb
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: sharepoint-sites-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft SharePoint REST API — Sites. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: microsoft-get-current-web
      description: Microsoft Get current web
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: sharepoint-sites.getweb
      outputParameters:
      - type: object
        mapping: $.
