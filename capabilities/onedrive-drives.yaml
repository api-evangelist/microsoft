naftiko: 1.0.0-alpha2
info:
  label: Microsoft OneDrive API — Drives
  description: 'Microsoft OneDrive API — Drives. 1 operations. Lead operation: Microsoft Get current user''s drive. Self-contained
    Naftiko capability covering one Microsoft business surface.'
  tags:
  - Microsoft
  - Drives
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_API_KEY: MICROSOFT_API_KEY
capability:
  consumes:
  - type: http
    namespace: onedrive-drives
    baseUri: https://graph.microsoft.com/v1.0
    description: Microsoft OneDrive API — Drives business capability. Self-contained, no shared references.
    resources:
    - name: me-drive
      path: /me/drive
      operations:
      - name: getcurrentuserdrive
        method: GET
        description: Microsoft Get current user's drive
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.MICROSOFT_API_KEY}}'
  exposes:
  - type: rest
    namespace: onedrive-drives-rest
    port: 8080
    description: REST adapter for Microsoft OneDrive API — Drives. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/me/drive
      name: me-drive
      description: REST surface for me-drive.
      operations:
      - method: GET
        name: getcurrentuserdrive
        description: Microsoft Get current user's drive
        call: onedrive-drives.getcurrentuserdrive
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: onedrive-drives-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft OneDrive API — Drives. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: microsoft-get-current-user-s-drive
      description: Microsoft Get current user's drive
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: onedrive-drives.getcurrentuserdrive
      outputParameters:
      - type: object
        mapping: $.
