naftiko: 1.0.0-alpha2
info:
  label: Microsoft Power Platform API — Entities
  description: 'Microsoft Power Platform API — Entities. 6 operations. Lead operation: Microsoft List accounts. Self-contained
    Naftiko capability covering one Microsoft business surface.'
  tags:
  - Microsoft
  - Entities
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_API_KEY: MICROSOFT_API_KEY
capability:
  consumes:
  - type: http
    namespace: power-platform-entities
    baseUri: https://{org}.api.crm.dynamics.com/api/data/v9.2
    description: Microsoft Power Platform API — Entities business capability. Self-contained, no shared references.
    resources:
    - name: accounts
      path: /accounts
      operations:
      - name: listaccounts
        method: GET
        description: Microsoft List accounts
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createaccount
        method: POST
        description: Microsoft Create an account
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: accounts({accountid})
      path: /accounts({accountid})
      operations:
      - name: getaccount
        method: GET
        description: Microsoft Get an account
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountid
          in: path
          type: string
          description: Account unique identifier
          required: true
      - name: updateaccount
        method: PATCH
        description: Microsoft Update an account
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountid
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deleteaccount
        method: DELETE
        description: Microsoft Delete an account
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountid
          in: path
          type: string
          required: true
    - name: contacts
      path: /contacts
      operations:
      - name: listcontacts
        method: GET
        description: Microsoft List contacts
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.MICROSOFT_API_KEY}}'
  exposes:
  - type: rest
    namespace: power-platform-entities-rest
    port: 8080
    description: REST adapter for Microsoft Power Platform API — Entities. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/accounts
      name: accounts
      description: REST surface for accounts.
      operations:
      - method: GET
        name: listaccounts
        description: Microsoft List accounts
        call: power-platform-entities.listaccounts
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createaccount
        description: Microsoft Create an account
        call: power-platform-entities.createaccount
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/accounts-accountid
      name: accounts-accountid
      description: REST surface for accounts({accountid}).
      operations:
      - method: GET
        name: getaccount
        description: Microsoft Get an account
        call: power-platform-entities.getaccount
        with:
          accountid: rest.accountid
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updateaccount
        description: Microsoft Update an account
        call: power-platform-entities.updateaccount
        with:
          accountid: rest.accountid
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteaccount
        description: Microsoft Delete an account
        call: power-platform-entities.deleteaccount
        with:
          accountid: rest.accountid
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/contacts
      name: contacts
      description: REST surface for contacts.
      operations:
      - method: GET
        name: listcontacts
        description: Microsoft List contacts
        call: power-platform-entities.listcontacts
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: power-platform-entities-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Power Platform API — Entities. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: microsoft-list-accounts
      description: Microsoft List accounts
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: power-platform-entities.listaccounts
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-create-account
      description: Microsoft Create an account
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: power-platform-entities.createaccount
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-get-account
      description: Microsoft Get an account
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: power-platform-entities.getaccount
      with:
        accountid: tools.accountid
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-update-account
      description: Microsoft Update an account
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: power-platform-entities.updateaccount
      with:
        accountid: tools.accountid
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-delete-account
      description: Microsoft Delete an account
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: power-platform-entities.deleteaccount
      with:
        accountid: tools.accountid
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-list-contacts
      description: Microsoft List contacts
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: power-platform-entities.listcontacts
      outputParameters:
      - type: object
        mapping: $.
