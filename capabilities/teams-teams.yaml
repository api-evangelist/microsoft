naftiko: 1.0.0-alpha2
info:
  label: Microsoft Teams API — Teams
  description: 'Microsoft Teams API — Teams. 5 operations. Lead operation: Microsoft List all teams. Self-contained Naftiko
    capability covering one Microsoft business surface.'
  tags:
  - Microsoft
  - Teams
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_API_KEY: MICROSOFT_API_KEY
capability:
  consumes:
  - type: http
    namespace: teams-teams
    baseUri: https://graph.microsoft.com/v1.0
    description: Microsoft Teams API — Teams business capability. Self-contained, no shared references.
    resources:
    - name: teams
      path: /teams
      operations:
      - name: listteams
        method: GET
        description: Microsoft List all teams
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createteam
        method: POST
        description: Microsoft Create a team
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: teams-teamId
      path: /teams/{teamId}
      operations:
      - name: getteam
        method: GET
        description: Microsoft Get a team
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updateteam
        method: PATCH
        description: Microsoft Update a team
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deleteteam
        method: DELETE
        description: Microsoft Delete a team
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.MICROSOFT_API_KEY}}'
  exposes:
  - type: rest
    namespace: teams-teams-rest
    port: 8080
    description: REST adapter for Microsoft Teams API — Teams. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/teams
      name: teams
      description: REST surface for teams.
      operations:
      - method: GET
        name: listteams
        description: Microsoft List all teams
        call: teams-teams.listteams
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createteam
        description: Microsoft Create a team
        call: teams-teams.createteam
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/teams/{teamid}
      name: teams-teamid
      description: REST surface for teams-teamId.
      operations:
      - method: GET
        name: getteam
        description: Microsoft Get a team
        call: teams-teams.getteam
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updateteam
        description: Microsoft Update a team
        call: teams-teams.updateteam
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteteam
        description: Microsoft Delete a team
        call: teams-teams.deleteteam
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: teams-teams-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Teams API — Teams. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: microsoft-list-all-teams
      description: Microsoft List all teams
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: teams-teams.listteams
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-create-team
      description: Microsoft Create a team
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: teams-teams.createteam
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-get-team
      description: Microsoft Get a team
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: teams-teams.getteam
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-update-team
      description: Microsoft Update a team
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: teams-teams.updateteam
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-delete-team
      description: Microsoft Delete a team
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: teams-teams.deleteteam
      outputParameters:
      - type: object
        mapping: $.
