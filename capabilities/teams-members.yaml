naftiko: 1.0.0-alpha2
info:
  label: Microsoft Teams API — Members
  description: 'Microsoft Teams API — Members. 2 operations. Lead operation: Microsoft List team members. Self-contained Naftiko
    capability covering one Microsoft business surface.'
  tags:
  - Microsoft
  - Members
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_API_KEY: MICROSOFT_API_KEY
capability:
  consumes:
  - type: http
    namespace: teams-members
    baseUri: https://graph.microsoft.com/v1.0
    description: Microsoft Teams API — Members business capability. Self-contained, no shared references.
    resources:
    - name: teams-teamId-members
      path: /teams/{teamId}/members
      operations:
      - name: listteammembers
        method: GET
        description: Microsoft List team members
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: addteammember
        method: POST
        description: Microsoft Add a team member
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.MICROSOFT_API_KEY}}'
  exposes:
  - type: rest
    namespace: teams-members-rest
    port: 8080
    description: REST adapter for Microsoft Teams API — Members. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/teams/{teamid}/members
      name: teams-teamid-members
      description: REST surface for teams-teamId-members.
      operations:
      - method: GET
        name: listteammembers
        description: Microsoft List team members
        call: teams-members.listteammembers
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: addteammember
        description: Microsoft Add a team member
        call: teams-members.addteammember
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: teams-members-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Teams API — Members. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: microsoft-list-team-members
      description: Microsoft List team members
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: teams-members.listteammembers
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-add-team-member
      description: Microsoft Add a team member
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: teams-members.addteammember
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
