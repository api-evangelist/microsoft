naftiko: 1.0.0-alpha2
info:
  label: Microsoft Bing Search APIs — Video Search
  description: 'Microsoft Bing Search APIs — Video Search. 1 operations. Lead operation: Microsoft Video search. Self-contained
    Naftiko capability covering one Microsoft business surface.'
  tags:
  - Microsoft
  - Video Search
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_API_KEY: MICROSOFT_API_KEY
capability:
  consumes:
  - type: http
    namespace: bing-search-video-search
    baseUri: https://api.bing.microsoft.com/v7.0
    description: Microsoft Bing Search APIs — Video Search business capability. Self-contained, no shared references.
    resources:
    - name: videos-search
      path: /videos/search
      operations:
      - name: videosearch
        method: GET
        description: Microsoft Video search
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: q
          in: query
          type: string
          description: The search query string
          required: true
        - name: count
          in: query
          type: integer
        - name: offset
          in: query
          type: integer
        - name: mkt
          in: query
          type: string
    authentication:
      type: apikey
      key: Ocp-Apim-Subscription-Key
      value: '{{env.MICROSOFT_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: bing-search-video-search-rest
    port: 8080
    description: REST adapter for Microsoft Bing Search APIs — Video Search. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/videos/search
      name: videos-search
      description: REST surface for videos-search.
      operations:
      - method: GET
        name: videosearch
        description: Microsoft Video search
        call: bing-search-video-search.videosearch
        with:
          q: rest.q
          count: rest.count
          offset: rest.offset
          mkt: rest.mkt
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: bing-search-video-search-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Bing Search APIs — Video Search. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: microsoft-video-search
      description: Microsoft Video search
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: bing-search-video-search.videosearch
      with:
        q: tools.q
        count: tools.count
        offset: tools.offset
        mkt: tools.mkt
      outputParameters:
      - type: object
        mapping: $.
