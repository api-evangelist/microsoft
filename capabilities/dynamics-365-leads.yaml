naftiko: 1.0.0-alpha2
info:
  label: Microsoft Dynamics 365 REST API — Leads
  description: 'Microsoft Dynamics 365 REST API — Leads. 2 operations. Lead operation: Microsoft List leads. Self-contained
    Naftiko capability covering one Microsoft business surface.'
  tags:
  - Microsoft
  - Leads
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_API_KEY: MICROSOFT_API_KEY
capability:
  consumes:
  - type: http
    namespace: dynamics-365-leads
    baseUri: https://{org}.api.crm.dynamics.com/api/data/v9.2
    description: Microsoft Dynamics 365 REST API — Leads business capability. Self-contained, no shared references.
    resources:
    - name: leads
      path: /leads
      operations:
      - name: listleads
        method: GET
        description: Microsoft List leads
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createlead
        method: POST
        description: Microsoft Create a lead
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.MICROSOFT_API_KEY}}'
  exposes:
  - type: rest
    namespace: dynamics-365-leads-rest
    port: 8080
    description: REST adapter for Microsoft Dynamics 365 REST API — Leads. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/leads
      name: leads
      description: REST surface for leads.
      operations:
      - method: GET
        name: listleads
        description: Microsoft List leads
        call: dynamics-365-leads.listleads
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createlead
        description: Microsoft Create a lead
        call: dynamics-365-leads.createlead
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: dynamics-365-leads-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Dynamics 365 REST API — Leads. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: microsoft-list-leads
      description: Microsoft List leads
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: dynamics-365-leads.listleads
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-create-lead
      description: Microsoft Create a lead
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: dynamics-365-leads.createlead
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
