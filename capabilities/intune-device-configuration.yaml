naftiko: 1.0.0-alpha2
info:
  label: Microsoft Intune API — Device Configuration
  description: 'Microsoft Intune API — Device Configuration. 1 operations. Lead operation: Microsoft List device configurations.
    Self-contained Naftiko capability covering one Microsoft business surface.'
  tags:
  - Microsoft
  - Device Configuration
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_API_KEY: MICROSOFT_API_KEY
capability:
  consumes:
  - type: http
    namespace: intune-device-configuration
    baseUri: https://graph.microsoft.com/v1.0
    description: Microsoft Intune API — Device Configuration business capability. Self-contained, no shared references.
    resources:
    - name: deviceManagement-deviceConfigurations
      path: /deviceManagement/deviceConfigurations
      operations:
      - name: listdeviceconfigurations
        method: GET
        description: Microsoft List device configurations
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.MICROSOFT_API_KEY}}'
  exposes:
  - type: rest
    namespace: intune-device-configuration-rest
    port: 8080
    description: REST adapter for Microsoft Intune API — Device Configuration. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/devicemanagement/deviceconfigurations
      name: devicemanagement-deviceconfigurations
      description: REST surface for deviceManagement-deviceConfigurations.
      operations:
      - method: GET
        name: listdeviceconfigurations
        description: Microsoft List device configurations
        call: intune-device-configuration.listdeviceconfigurations
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: intune-device-configuration-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Intune API — Device Configuration. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: microsoft-list-device-configurations
      description: Microsoft List device configurations
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: intune-device-configuration.listdeviceconfigurations
      outputParameters:
      - type: object
        mapping: $.
