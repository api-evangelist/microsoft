    description: Microsoft Outlook API — Mail business capability. Self-contained, no shared references.
    resources:
    - name: mailFolders
      path: /mailFolders
      operations:
      - name: listmailfolders
        method: GET
        description: Microsoft List mail folders
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: messages
      path: /messages
      operations:
      - name: listmessages
        method: GET
        description: Microsoft List messages
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: messages-messageId
      path: /messages/{messageId}
      operations:
      - name: getmessage
        method: GET
        description: Microsoft Get a message
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatemessage
        method: PATCH
        description: Microsoft Update a message
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletemessage
        method: DELETE
        description: Microsoft Delete a message
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: sendMail
