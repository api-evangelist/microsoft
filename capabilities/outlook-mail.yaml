naftiko: 1.0.0-alpha2
info:
  label: Microsoft Outlook API — Mail
  description: 'Microsoft Outlook API — Mail. 6 operations. Lead operation: Microsoft List mail folders. Self-contained Naftiko
    capability covering one Microsoft business surface.'
  tags:
  - Microsoft
  - Mail
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_API_KEY: MICROSOFT_API_KEY
capability:
