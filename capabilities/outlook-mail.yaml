      - name: sendmail
        method: POST
        description: Microsoft Send mail
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.MICROSOFT_API_KEY}}'
  exposes:
  - type: rest
    namespace: outlook-mail-rest
    port: 8080
    description: REST adapter for Microsoft Outlook API — Mail. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/mailfolders
      name: mailfolders
      description: REST surface for mailFolders.
      operations:
      - method: GET
        name: listmailfolders
        description: Microsoft List mail folders
        call: outlook-mail.listmailfolders
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/messages
      name: messages
      description: REST surface for messages.
      operations:
      - method: GET
        name: listmessages
        description: Microsoft List messages
        call: outlook-mail.listmessages
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/messages/{messageid}
      name: messages-messageid
      description: REST surface for messages-messageId.
      operations:
      - method: GET
        name: getmessage
        description: Microsoft Get a message
        call: outlook-mail.getmessage
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updatemessage
        description: Microsoft Update a message
        call: outlook-mail.updatemessage
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletemessage
        description: Microsoft Delete a message
        call: outlook-mail.deletemessage
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/sendmail
      name: sendmail
      description: REST surface for sendMail.
      operations:
      - method: POST
        name: sendmail
        description: Microsoft Send mail
        call: outlook-mail.sendmail
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
