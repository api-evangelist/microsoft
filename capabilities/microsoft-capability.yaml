naftiko: 1.0.0-alpha2
info:
  label: Microsoft Azure Cognitive Services API
  description: APIs for vision, speech, language, and decision-making AI capabilities including Computer Vision, Text Analytics,
    and Translator services.
  tags:
  - Microsoft
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
  consumes:
  - type: http
    namespace: microsoft
    baseUri: https://eastus.api.cognitive.microsoft.com
    description: Microsoft Azure Cognitive Services API HTTP API.
    authentication:
      type: apikey
      in: header
      name: Ocp-Apim-Subscription-Key
      value: '{{MICROSOFT_TOKEN}}'
    resources:
    - name: vision-v3-2-analyze
      path: /vision/v3.2/analyze
      operations:
      - name: analyzeimage
        method: POST
        description: Microsoft Analyze image
        inputParameters:
        - name: visualFeatures
          in: query
          type: string
          description: Visual features to analyze
        - name: language
          in: query
          type: string
          description: Language for response
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: vision-v3-2-ocr
      path: /vision/v3.2/ocr
      operations:
      - name: recognizetext
        method: POST
        description: Microsoft Optical character recognition
        inputParameters:
        - name: language
          in: query
          type: string
          description: BCP-47 language code of the text to detect
        - name: detectOrientation
          in: query
          type: boolean
          description: Whether to detect text orientation
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: text-analytics-v3-1-sentiment
      path: /text/analytics/v3.1/sentiment
      operations:
      - name: analyzesentiment
        method: POST
        description: Microsoft Analyze sentiment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: text-analytics-v3-1-entities-recognition-general
      path: /text/analytics/v3.1/entities/recognition/general
      operations:
      - name: recognizeentities
        method: POST
        description: Microsoft Recognize named entities
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: text-analytics-v3-1-keyphrases
      path: /text/analytics/v3.1/keyPhrases
      operations:
      - name: extractkeyphrases
        method: POST
        description: Microsoft Extract key phrases
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: translate
      path: /translate
      operations:
      - name: translatetext
        method: POST
        description: Microsoft Translate text
        inputParameters:
        - name: api-version
          in: query
          type: string
          required: true
        - name: to
          in: query
          type: array
          required: true
          description: Target language codes
        - name: from
          in: query
          type: string
          description: Source language code
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: languages
      path: /languages
      operations:
      - name: getlanguages
        method: GET
        description: Microsoft Get supported languages
        inputParameters:
        - name: api-version
          in: query
          type: string
          required: true
        - name: scope
          in: query
          type: string
          description: Comma-separated group of language names
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: microsoft-rest
    description: REST adapter for Microsoft Azure Cognitive Services API.
    resources:
    - path: /vision/v3.2/analyze
      name: analyzeimage
      operations:
      - method: POST
        name: analyzeimage
        description: Microsoft Analyze image
        call: microsoft.analyzeimage
        outputParameters:
        - type: object
          mapping: $.
    - path: /vision/v3.2/ocr
      name: recognizetext
      operations:
      - method: POST
        name: recognizetext
        description: Microsoft Optical character recognition
        call: microsoft.recognizetext
        outputParameters:
        - type: object
          mapping: $.
    - path: /text/analytics/v3.1/sentiment
      name: analyzesentiment
      operations:
      - method: POST
        name: analyzesentiment
        description: Microsoft Analyze sentiment
        call: microsoft.analyzesentiment
        outputParameters:
        - type: object
          mapping: $.
    - path: /text/analytics/v3.1/entities/recognition/general
      name: recognizeentities
      operations:
      - method: POST
        name: recognizeentities
        description: Microsoft Recognize named entities
        call: microsoft.recognizeentities
        outputParameters:
        - type: object
          mapping: $.
    - path: /text/analytics/v3.1/keyPhrases
      name: extractkeyphrases
      operations:
      - method: POST
        name: extractkeyphrases
        description: Microsoft Extract key phrases
        call: microsoft.extractkeyphrases
        outputParameters:
        - type: object
          mapping: $.
    - path: /translate
      name: translatetext
      operations:
      - method: POST
        name: translatetext
        description: Microsoft Translate text
        call: microsoft.translatetext
        outputParameters:
        - type: object
          mapping: $.
    - path: /languages
      name: getlanguages
      operations:
      - method: GET
        name: getlanguages
        description: Microsoft Get supported languages
        call: microsoft.getlanguages
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: microsoft-mcp
    transport: http
    description: MCP adapter for Microsoft Azure Cognitive Services API for AI agent use.
    tools:
    - name: analyzeimage
      description: Microsoft Analyze image
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: microsoft.analyzeimage
      with:
        visualFeatures: tools.visualFeatures
        language: tools.language
      inputParameters:
      - name: visualFeatures
        type: string
        description: Visual features to analyze
      - name: language
        type: string
        description: Language for response
      outputParameters:
      - type: object
        mapping: $.
    - name: recognizetext
      description: Microsoft Optical character recognition
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: microsoft.recognizetext
      with:
        language: tools.language
        detectOrientation: tools.detectOrientation
      inputParameters:
      - name: language
        type: string
        description: BCP-47 language code of the text to detect
      - name: detectOrientation
        type: boolean
        description: Whether to detect text orientation
      outputParameters:
      - type: object
        mapping: $.
    - name: analyzesentiment
      description: Microsoft Analyze sentiment
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: microsoft.analyzesentiment
      outputParameters:
      - type: object
        mapping: $.
    - name: recognizeentities
      description: Microsoft Recognize named entities
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: microsoft.recognizeentities
      outputParameters:
      - type: object
        mapping: $.
    - name: extractkeyphrases
      description: Microsoft Extract key phrases
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: microsoft.extractkeyphrases
      outputParameters:
      - type: object
        mapping: $.
    - name: translatetext
      description: Microsoft Translate text
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: microsoft.translatetext
      with:
        api-version: tools.api-version
        to: tools.to
        from: tools.from
      inputParameters:
      - name: api-version
        type: string
        description: api-version
        required: true
      - name: to
        type: array
        description: Target language codes
        required: true
      - name: from
        type: string
        description: Source language code
      outputParameters:
      - type: object
        mapping: $.
    - name: getlanguages
      description: Microsoft Get supported languages
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: microsoft.getlanguages
      with:
        api-version: tools.api-version
        scope: tools.scope
      inputParameters:
      - name: api-version
        type: string
        description: api-version
        required: true
      - name: scope
        type: string
        description: Comma-separated group of language names
      outputParameters:
      - type: object
        mapping: $.
binds:
- namespace: env
  keys:
    MICROSOFT_TOKEN: MICROSOFT_TOKEN
